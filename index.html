<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluência Leitora</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      text-align: center;
      padding: 30px;
      color: #333;
    }

    .caixa {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #3157a4;
    }

    select, button, input {
      font-size: 18px;
      padding: 12px;
      margin: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      background: #3157a4;
      color: white;
      border: none;
    }

    button:hover {
      opacity: 0.9;
    }

    #palavra {
      font-size: 52px;
      font-weight: bold;
      margin: 40px 0;
      color: #222;
    }

    #tempo {
      font-size: 24px;
      font-weight: bold;
    }

    #resultado {
      font-size: 24px;
      margin-top: 20px;
    }

    .botoes {
      display: none;
    }
  </style>
</head>

<body>

  <div class="caixa">

    <h1>📚 FLUÊNCIA LEITORA</h1>

    <p>LEIA O MAIOR NÚMERO DE PALAVRAS QUE CONSEGUIR EM 1 MINUTO!</p>

    <input
      type="text"
      id="nome"
      placeholder="DIGITE SEU PRIMEIRO NOME"
      maxlength="20"
    >

    <br>

    <label for="nivel">ESCOLHA O NÍVEL:</label>

    <select id="nivel">
      <option value="1">NÍVEL 1</option>
      <option value="2">NÍVEL 2</option>
      <option value="3">NÍVEL 3</option>
      <option value="4">NÍVEL 4</option>
    </select>

    <br>

    <button id="iniciar" onclick="iniciarJogo()">▶ COMEÇAR</button>

    <div id="jogo" style="display:none;">

      <p id="tempo">⏱️ TEMPO: 60 SEGUNDOS</p>

      <div id="palavra"></div>

      <div class="botoes" id="botoes">

        <button onclick="acertou()">✅ LI CERTO</button>

        <button onclick="errou()">❌ ERREI / PULAR</button>

      </div>

    </div>

    <div id="resultado"></div>

  </div>

<script>

const palavras = {

  1: [
    "CASA",
    "BOLA",
    "GATO",
    "PATO",
    "MALA",
    "DADO",
    "FADA",
    "SAPO",
    "RATO",
    "BOCA",
    "DEDO",
    "VELA",
    "LATA",
    "MESA",
    "CAMA",
    "LOBO",
    "MAPA",
    "PIPA",
    "VACA",
    "FOCA"
  ],

  2: [
    "BANANA",
    "BONECA",
    "CAMISA",
    "TOMATE",
    "MENINA",
    "MENINO",
    "SAPATO",
    "PANELA",
    "PETECA",
    "CAVALO",
    "PIPOCA",
    "MACACO",
    "JANELA",
    "CANETA",
    "BATATA",
    "PIRATA",
    "SALADA",
    "CABIDE",
    "BIGODE",
    "MOEDA"
  ],

  3: [
    "BORBOLETA",
    "TELEFONE",
    "BICICLETA",
    "GELATINA",
    "CAMISETA",
    "MARINHEIRO",
    "FORMIGA",
    "ABACAXI",
    "MELANCIA",
    "ELEFANTE",
    "DINOSSAURO",
    "CHOCOLATE",
    "PASSARINHO",
    "PARAFUSO",
    "CAPACETE",
    "CADERNO",
    "GIRASSOL",
    "JACARÉ",
    "SORVETE",
    "CARAMELO"
  ],

  4: [
    "BRINCO",
    "PRATO",
    "TRATOR",
    "BLUSA",
    "PLANTA",
    "FRUTA",
    "GRILO",
    "CRAVO",
    "CHAVE",
    "CHUVA",
    "FOLHA",
    "MILHO",
    "NINHO",
    "PALHAÇO",
    "COELHO",
    "QUEIJO",
    "GUERRA",
    "CARRO",
    "PASSAGEM",
    "ESTRELA",
    "BRINQUEDO",
    "FLORESTA",
    "DRAGÃO",
    "PROBLEMA",
    "TRABALHO"
  ]

};

let lista = [];
let indice = 0;
let pontos = 0;
let erros = 0;
let tempo = 60;
let cronometro;

function embaralhar(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function iniciarJogo() {

  const nome = document.getElementById("nome").value.trim();

  if (nome === "") {
    alert("DIGITE SEU PRIMEIRO NOME PARA COMEÇAR.");
    return;
  }

  const nivel = document.getElementById("nivel").value;

  lista = embaralhar(palavras[nivel]);

  indice = 0;
  pontos = 0;
  erros = 0;
  tempo = 60;

  document.getElementById("resultado").innerHTML = "";
  document.getElementById("jogo").style.display = "block";
  document.getElementById("botoes").style.display = "block";
  document.getElementById("iniciar").disabled = true;
  document.getElementById("nivel").disabled = true;
  document.getElementById("nome").disabled = true;

  mostrarPalavra();

  document.getElementById("tempo").innerHTML =
    "⏱️ TEMPO: " + tempo + " SEGUNDOS";

  cronometro = setInterval(function() {

    tempo--;

    document.getElementById("tempo").innerHTML =
      "⏱️ TEMPO: " + tempo + " SEGUNDOS";

    if (tempo <= 0) {
      finalizarJogo();
    }

  }, 1000);
}

function mostrarPalavra() {

  if (indice >= lista.length) {
    lista = embaralhar(lista);
    indice = 0;
  }

  document.getElementById("palavra").innerText =
    lista[indice].toUpperCase();
}

function acertou() {

  pontos++;
  indice++;

  mostrarPalavra();
}

function errou() {

  erros++;
  indice++;

  mostrarPalavra();
}

function finalizarJogo() {

  clearInterval(cronometro);

  const nome = document.getElementById("nome").value;
  const nivel = document.getElementById("nivel").value;

  document.getElementById("botoes").style.display = "none";
  document.getElementById("palavra").innerText = "⏰ TEMPO ENCERRADO!";

  document.getElementById("resultado").innerHTML =
    "<strong>" + nome.toUpperCase() + "</strong><br>" +
    "NÍVEL " + nivel + "<br><br>" +
    "🏆 PALAVRAS LIDAS CORRETAMENTE: <strong>" + pontos + "</strong><br>" +
    "PALAVRAS PULADAS/ERRADAS: " + erros +
    "<br><br><button onclick='reiniciar()'>🔄 JOGAR NOVAMENTE</button>";
}

function reiniciar() {

  document.getElementById("jogo").style.display = "none";
  document.getElementById("resultado").innerHTML = "";

  document.getElementById("iniciar").disabled = false;
  document.getElementById("nivel").disabled = false;
  document.getElementById("nome").disabled = false;
}

</script>

  <footer style="margin-top: 30px; font-size: 14px;">
  © 2026 Professora Lígia Andrade — Todos os direitos reservados.
</footer>
</body>
</html>
