<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descubra a Palavra</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8ff;
      text-align: center;
      padding: 20px;
      color: #333;
    }

    .caixa {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    h1 {
      color: #3157a4;
      font-size: 32px;
    }

    #fase {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #placar {
      font-size: 18px;
      margin: 15px 0;
    }

    #imagem {
      font-size: 110px;
      margin: 25px 0;
    }

    .opcao {
      display: block;
      width: 90%;
      max-width: 450px;
      margin: 12px auto;
      padding: 16px;
      font-size: 25px;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      background: #e5edff;
      cursor: pointer;
    }

    .opcao:hover {
      background: #d2dfff;
    }

    #mensagem {
      font-size: 24px;
      font-weight: bold;
      min-height: 35px;
      margin: 20px;
    }

    #proxima,
    #jogarNovamente {
      padding: 14px 25px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      background: #3157a4;
      color: white;
      cursor: pointer;
    }

    #proxima {
      display: none;
    }

    #jogarNovamente {
      display: none;
      margin-top: 20px;
    }

    #resultado {
      font-size: 24px;
      font-weight: bold;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="caixa">

    <h1>📚 DESCUBRA A PALAVRA</h1>

    <div id="fase">QUESTÃO 1 DE 20</div>

    <div id="placar">
      ✅ ACERTOS: 0 &nbsp;&nbsp; ❌ ERROS: 0
    </div>

    <div id="imagem">🐱</div>

    <div id="opcoes"></div>

    <div id="mensagem"></div>

    <button id="proxima" onclick="proximaPergunta()">
      PRÓXIMA ➜
    </button>

    <div id="resultado"></div>

    <button id="jogarNovamente" onclick="jogarNovamente()">
      🔄 JOGAR NOVAMENTE
    </button>

    <footer>
      © 2026 Professora Lígia Andrade — Todos os direitos reservados.
    </footer>

  </div>

<script>

const perguntas = [

  {
    imagem: "🐱",
    correta: "GATO",
    opcoes: ["GATO", "PATO", "GALO"]
  },

  {
    imagem: "⚽",
    correta: "BOLA",
    opcoes: ["BOLA", "BOTA", "BALA"]
  },

  {
    imagem: "🍇",
    correta: "UVA",
    opcoes: ["UVA", "ASA", "OVO"]
  },

  {
    imagem: "🐸",
    correta: "SAPO",
    opcoes: ["SAPO", "SACO", "SABÃO"]
  },

  {
    imagem: "🏠",
    correta: "CASA",
    opcoes: ["CASA", "CAMA", "CANA"]
  },

  {
    imagem: "🦆",
    correta: "PATO",
    opcoes: ["PATO", "GATO", "RATO"]
  },

  {
    imagem: "🐭",
    correta: "RATO",
    opcoes: ["RATO", "GATO", "MATO"]
  },

  {
    imagem: "👜",
    correta: "MALA",
    opcoes: ["MALA", "MOLA", "MATA"]
  },

  {
    imagem: "🍰",
    correta: "BOLO",
    opcoes: ["BOLO", "BOLA", "BICO"]
  },

  {
    imagem: "🎲",
    correta: "DADO",
    opcoes: ["DADO", "DEDO", "DADO"]
  },

  {
    imagem: "🕯️",
    correta: "VELA",
    opcoes: ["VELA", "VACA", "VILA"]
  },

  {
    imagem: "🥫",
    correta: "LATA",
    opcoes: ["LATA", "LAMA", "LAPA"]
  },

  {
    imagem: "🛏️",
    correta: "CAMA",
    opcoes: ["CAMA", "CANA", "CARA"]
  },

  {
    imagem: "🏍️",
    correta: "MOTO",
    opcoes: ["MOTO", "MATO", "MOLA"]
  },

  {
    imagem: "🧚",
    correta: "FADA",
    opcoes: ["FADA", "FITA", "FACA"]
  },

  {
    imagem: "🪁",
    correta: "PIPA",
    opcoes: ["PIPA", "PINO", "PIPA"]
  },

  {
    imagem: "🐺",
    correta: "LOBO",
    opcoes: ["LOBO", "LOJA", "LODO"]
  },

  {
    imagem: "🐄",
    correta: "VACA",
    opcoes: ["VACA", "VAGA", "VILA"]
  },

  {
    imagem: "🐟",
    correta: "PEIXE",
    opcoes: ["PEIXE", "PEITO", "PEIXÃO"]
  },

  {
    imagem: "🐒",
    correta: "MACACO",
    opcoes: ["MACACO", "MALA", "MARTE"]
  }

];

let perguntaAtual = 0;
let acertos = 0;
let erros = 0;
let respondeu = false;


/* EMBARALHA AS TRÊS ALTERNATIVAS */

function embaralhar(array) {

  const copia = [...array];

  for (let i = copia.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [copia[i], copia[j]] = [copia[j], copia[i]];

  }

  return copia;
}


function carregarPergunta() {

  respondeu = false;

  const pergunta = perguntas[perguntaAtual];

  document.getElementById("fase").innerText =
    "QUESTÃO " + (perguntaAtual + 1) + " DE 20";

  document.getElementById("placar").innerText =
    "✅ ACERTOS: " + acertos +
    "     ❌ ERROS: " + erros;

  document.getElementById("imagem").innerText =
    pergunta.imagem;

  document.getElementById("mensagem").innerText = "";

  document.getElementById("proxima").style.display = "none";

  const opcoes = document.getElementById("opcoes");

  opcoes.innerHTML = "";


  /* AQUI AS RESPOSTAS SÃO EMBARALHADAS */

  const opcoesEmbaralhadas = embaralhar(pergunta.opcoes);


  opcoesEmbaralhadas.forEach(function(palavra) {

    const botao = document.createElement("button");

    botao.className = "opcao";

    botao.innerText = palavra.toUpperCase();

    botao.onclick = function() {

      verificarResposta(palavra);

    };

    opcoes.appendChild(botao);

  });

}


function verificarResposta(resposta) {

  if (respondeu) {

    return;

  }

  const pergunta = perguntas[perguntaAtual];


  if (
    resposta.toUpperCase() ===
    pergunta.correta.toUpperCase()
  ) {

    acertos++;

    respondeu = true;

    document.getElementById("mensagem").innerText =
      "🎉 MUITO BEM! ⭐";

  } else {

    erros++;

    respondeu = true;

    document.getElementById("mensagem").innerText =
      "💭 NÃO FOI ESSA!";

  }


  document.getElementById("placar").innerText =
    "✅ ACERTOS: " + acertos +
    "     ❌ ERROS: " + erros;

  document.getElementById("proxima").style.display =
    "inline-block";

}


function proximaPergunta() {

  perguntaAtual++;

  if (perguntaAtual < perguntas.length) {

    carregarPergunta();

  } else {

    finalizarJogo();

  }

}


function finalizarJogo() {

  document.getElementById("fase").innerText =
    "🏆 DESAFIO CONCLUÍDO!";

  document.getElementById("imagem").innerText =
    "🌟";

  document.getElementById("opcoes").innerHTML = "";

  document.getElementById("mensagem").innerText = "";

  document.getElementById("proxima").style.display =
    "none";


  const porcentagem =
    Math.round((acertos / 20) * 100);


  document.getElementById("resultado").innerHTML =
    "PARABÉNS! 🎉<br><br>" +
    "Você respondeu 20 palavras.<br><br>" +
    "✅ ACERTOS: " + acertos + "<br>" +
    "❌ ERROS: " + erros + "<br>" +
    "📊 APROVEITAMENTO: " + porcentagem + "%";


  document.getElementById("jogarNovamente").style.display =
    "inline-block";

}


function jogarNovamente() {

  perguntaAtual = 0;

  acertos = 0;

  erros = 0;

  document.getElementById("resultado").innerHTML = "";

  document.getElementById("jogarNovamente").style.display =
    "none";

  carregarPergunta();

}


carregarPergunta();

</script>

</body>
</html>
